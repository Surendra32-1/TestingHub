<div class="menu-level" [class.menu-level--root]="level() === 0" [class.menu-level--submenu]="level() > 0">
  @for (item of items(); track item.id) {
    @if (item.children && item.children.length > 0) {
      <div
        class="menu-branch"
        [class.menu-branch--root]="level() === 0"
        [class.menu-branch--active]="isBranchActive(item)"
      >
        <button type="button" class="nav-item menu-toggle" [class.menu-row]="level() > 0">
          {{ item.label }}<span class="menu-caret" aria-hidden="true">{{ level() === 0 ? '▼' : '›' }}</span>
        </button>

        <div class="dropdown-menu">
          <app-nav-menu [items]="item.children" [level]="level() + 1" />
        </div>
      </div>
    } @else {
      <a
        class="nav-item"
        [class.menu-row]="level() > 0"
        [class.nav-item--end]="item.alignEnd === true"
        [routerLink]="item.route"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: item.exact === true }"
      >{{ item.label }}</a>
    }
  }
</div>
