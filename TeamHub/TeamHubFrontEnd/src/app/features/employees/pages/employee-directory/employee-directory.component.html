<div class="page-shell">
  <app-topbar />

  <main class="directory-panel">
    <div class="heading-row" *ngIf="activeView !== 'details'">
      <div class="tab-row" role="tablist" aria-label="Directory tabs">
        <app-employee-tab
          *ngFor="let tab of tabs"
          [label]="tab.label"
          [active]="activeView === tab.key"
          (selected)="selectView(tab.key)"
        />
      </div>
      <button *ngIf="activeView === 'directory' && !readOnlyHome && canAddEmployee" class="add-btn" type="button" routerLink="/employees/add"><span>+</span>Add Employee</button>
    </div>

    <app-directory-view
      *ngIf="activeView === 'directory'"
      [employees]="employees"
      [tableLayout]="tableLayout"
      [readOnlyHome]="readOnlyHome"
      [canEditEmployee]="canEditEmployee"
      [canViewHierarchy]="canViewAdministrationHierarchy || readOnlyHome"
      [canViewEmployeeDetails]="canViewEmployeeCard"
      [canReleaseEmployee]="canReleaseEmployee"
      [canTerminateEmployee]="canTerminateEmployee"
      [showAddButton]="false"
      [isLoading]="isLoading"
      [pageNumber]="pageNumber"
      [pageSize]="pageSize"
      [totalCount]="totalCount"
      [searchTerm]="searchTerm"
      [searchField]="searchField"
      [departmentFilterName]="selectedDepartmentName"
      [resultsLabel]="selectedDepartmentName ? selectedDepartmentName + ' Employees' : 'All Employees'"
      (searchTermChange)="updateSearchTerm($event)"
      (searchFieldChange)="updateSearchField($event)"
      (departmentFilterChange)="filterByDepartment($event)"
      (clearDepartmentFilter)="clearDepartmentFilter()"
      (pageChange)="changePage($event)"
      (pageSizeChange)="changePageSize($event)"
      (editEmployee)="editEmployee($event)"
      (releaseEmployee)="releaseEmployee($event)"
      (terminateEmployee)="terminateEmployee($event)"
      (viewEmployeeHierarchy)="showEmployeeHierarchy($event)"
      (viewEmployeeDirectHierarchy)="showDirectHierarchy($event)"
      (viewEmployeeDetails)="showEmployeeDetails($event)"
    />
    <app-departments-view
      *ngIf="activeView === 'departments'"
      [initialDepartmentName]="selectedDepartmentName"
      [readOnlyHome]="readOnlyHome"
      [canEditEmployee]="canEditEmployee"
      [canViewEmployeeDetails]="canViewEmployeeCard || readOnlyHome"
      [canReleaseEmployee]="canReleaseEmployee"
      [canTerminateEmployee]="canTerminateEmployee"
      (editEmployee)="editEmployee($event)"
      (releaseEmployee)="releaseEmployee($event)"
      (terminateEmployee)="terminateEmployee($event)"
      (viewEmployeeHierarchy)="showEmployeeHierarchy($event)"
      (viewEmployeeDirectHierarchy)="showDirectHierarchy($event)"
      (viewEmployeeDetails)="showEmployeeDetails($event)"
    />
    <app-employee-hierarchy
      *ngIf="activeView === 'hierarchy' && hierarchyEmployeeId !== null"
      [employeeId]="hierarchyEmployeeId"
      [directOnly]="hierarchyDirect"
      [publicDirectory]="readOnlyHome"
      (back)="returnToDirectory()"
    />
    <app-employee-details
      *ngIf="activeView === 'details' && selectedEmployeeId !== null"
      [employeeId]="selectedEmployeeId"
      [readOnlyHome]="readOnlyHome"
      (back)="returnToDirectory()"
    />
  </main>
</div>
