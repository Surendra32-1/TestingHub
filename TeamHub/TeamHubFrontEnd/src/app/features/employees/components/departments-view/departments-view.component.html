<p class="loading-state" *ngIf="isLoadingDepartments" aria-live="polite">Loading departments...</p>

<section *ngIf="!isLoadingDepartments && !showEmployeeGrid" aria-label="Departments">
  <p class="empty-state" *ngIf="departments.length === 0">No departments found.</p>
  <div class="department-list" *ngIf="departments.length > 0">
    <button
      class="department-option"
      type="button"
      *ngFor="let department of departments"
      (click)="selectDepartment(department)">
      <span class="department-identity">
        <img
          *ngIf="departmentLeaders[department.departmentId] as leader"
          class="department-leader-avatar"
          [src]="leader.imageBase64"
          [alt]="leader.name + ' photo'"
          [title]="leader.name + ' - ' + leader.designation">
        <span *ngIf="!departmentLeaders[department.departmentId]" class="department-avatar-placeholder" aria-hidden="true">—</span>
        <span>{{ department.departmentName }}<ng-container *ngIf="departmentEmployeeCounts[department.departmentId] !== undefined"> ({{ departmentEmployeeCounts[department.departmentId] }})</ng-container></span>
      </span>
      <span class="department-arrow" aria-hidden="true">›</span>
    </button>
  </div>
</section>

<section *ngIf="showEmployeeGrid" class="department-employee-view" aria-label="Department employees">
  <app-directory-controls
    [searchTerm]="searchTerm"
    (searchTermChange)="updateSearchTerm($event)"
    [searchField]="searchField"
    (searchFieldChange)="updateSearchField($event)"
    [departmentOptions]="departments"
    [selectedDepartmentId]="selectedDepartment?.departmentId ?? null"
    (departmentChange)="selectDepartmentFilter($event)"
  />

  <app-results-header
    [isLoading]="isLoadingEmployees"
    [count]="totalCount"
    [label]="selectedDepartment?.departmentName ?? 'All Departments'"
    [showAddButton]="false"
  />

  <p class="loading-state" *ngIf="isLoadingEmployees" aria-live="polite">Loading employees...</p>
  <p class="department-hierarchy-loading" *ngIf="isLoadingHierarchy" aria-live="polite">
    Loading reporting hierarchy...
  </p>
  <p *ngIf="hierarchyLookupComplete && selectedDepartment && !departmentHead && totalCount > 0" class="department-no-head" role="status">
    No department head could be identified by designation rank.
  </p>

  <app-department-hierarchy
    *ngIf="!isLoadingEmployees"
    [departmentHead]="departmentHead"
    [departmentHeadDetails]="departmentHeadDetails"
    [members]="departmentMembers"
    [departmentName]="selectedDepartment ? 'Department Members' : 'Employees'"
    [canViewEmployeeDetails]="canViewEmployeeDetails"
    (viewEmployeeDetails)="viewEmployeeDetails.emit($event)"
  />

  <p class="empty-state" *ngIf="!isLoadingEmployees && employees.length === 0">
    {{ selectedDepartment ? 'No employees found in this department.' : 'No employees match your search.' }}
  </p>
</section>
