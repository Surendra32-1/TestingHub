<div class="results-header">
  <div class="results-summary">
    <span>{{ isLoading ? 'Loading employees...' : label + ' (' + count + ')' }}</span>
    <button *ngIf="filterLabel" type="button" class="clear-filter-button" (click)="clearFilter.emit()">
      Clear Filter
    </button>
  </div>
  <button *ngIf="showAddButton" type="button" class="add-btn" routerLink="/employees/add"><span>+</span>Add Employee</button>
</div>
