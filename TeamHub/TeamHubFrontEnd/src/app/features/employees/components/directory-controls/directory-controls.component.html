<div class="controls">
  <label class="search-box" aria-label="Search employees">
    <span class="search-icon">⌕</span>
    <input
      type="search"
      placeholder="Search employees..."
      [ngModel]="searchTerm"
      (ngModelChange)="updateSearchTerm($event)"
      aria-label="Search by name, designation, or department"
    />
  </label>

  <select
    *ngIf="departmentOptions === null"
    class="filter-pill"
    [ngModel]="searchField"
    (ngModelChange)="updateSearchField($event)"
    aria-label="Search by field"
  >
    <option value="all">All</option>
    <option value="name">Name</option>
    <option value="designation">Designation</option>
    <option value="department">Department</option>
  </select>
  <select
    *ngIf="departmentOptions !== null"
    class="filter-pill"
    [ngModel]="selectedDepartmentId?.toString() ?? ''"
    (ngModelChange)="updateDepartment($event)"
    aria-label="Filter by department"
  >
    <option value="">All</option>
    <option *ngFor="let department of departmentOptions" [value]="department.departmentId">
      {{ department.departmentName }}
    </option>
  </select>
</div>
